<title>Тренажёр по аркфункциям</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: школьная тетрадь в клетку — красная линия полей слева, вкладки сверху, рабочие панели на клетчатой бумаге */
:root{
  --paper:#f6f7fb; --surface:#ffffff; --ink:#1c2746; --muted:#5b6582; --line:#d8ddea;
  --grid:rgba(60,95,170,.09); --accent:#2d4db3; --accent-soft:#e4e9f9; --margin:#d1475a;
  --ok:#1d8656; --ok-soft:#e1f3ea; --bad:#c13838; --bad-soft:#fbe6e6;
  --c-asin:#2d4db3; --c-acos:#c2410c; --c-atg:#15803d; --c-actg:#7c3aed;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"PT Sans","Segoe UI",Arial,sans-serif;
  --f-math:"PT Serif",Georgia,serif;
  --f-mono:"PT Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;
  --grid:rgba(140,170,255,.07); --accent:#93a9ff; --accent-soft:#222c4c; --margin:#ff7c8b;
  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c-asin:#93a9ff; --c-acos:#ff9b63; --c-atg:#5bd38d; --c-actg:#bb97ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;
  --grid:rgba(140,170,255,.07); --accent:#93a9ff; --accent-soft:#222c4c; --margin:#ff7c8b;
  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c-asin:#93a9ff; --c-acos:#ff9b63; --c-atg:#5bd38d; --c-actg:#bb97ff; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{font-size:137.5%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;transition:background .2s,color .2s}
.wrap{max-width:min(72rem,100%);margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:relative;padding-block:28px 20px;padding-left:22px;display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-start}
header.top::before{content:"";position:absolute;left:0;top:24px;bottom:16px;width:2px;background:var(--margin)}
.htext{flex:1 1 520px;min-width:0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.sw button{font:inherit;font-size:.85rem;font-weight:700;letter-spacing:.04em;border:0;background:none;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sw svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.1rem,5vw,3.2rem);line-height:1.05;margin:.25em 0 .2em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.lead{max-width:62ch;color:var(--muted);margin:0}
h2{font-family:var(--f-display);font-size:1.7rem;margin:0 0 .4em;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1.3rem;margin:0}
p{margin:0}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:28px}
nav.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 14px 10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.m{font-family:var(--f-math);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.12;margin:0 .08em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .18em}
.fr>span:last-child{padding:0 .18em}

.cards{display:flex;flex-direction:column;gap:20px}
.hint{color:var(--muted);margin:0}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;min-width:0}
@media (max-width:900px){.fcard{grid-template-columns:1fr}}
.ftext{display:flex;flex-direction:column;gap:12px;min-width:0}
.fgraph{margin:0;display:flex;flex-direction:column;gap:10px;position:sticky;top:4rem;min-width:0}
.fgraph svg{display:block;width:100%;height:auto}
.fgraph figcaption{font-size:.95rem;line-height:1.6;min-height:3.2em;border-left:3px solid var(--fc);padding-left:12px}
.props{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prop{font:inherit;width:100%;text-align:left;display:grid;grid-template-columns:minmax(8.5em,auto) 1fr;gap:4px 14px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);cursor:pointer}
.prop:hover{border-color:var(--fc)}
.prop[aria-pressed="true"]{border-color:var(--fc);background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--fc)}
.prop .pl{color:var(--muted);font-size:.9rem}
.prop .pv{white-space:normal}
@media (max-width:520px){.prop{grid-template-columns:1fr}}
.fcard .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fcard .sym{font-family:var(--f-math);font-size:1.5rem}
.fcard .tag{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.def{border-left:3px solid var(--fc);padding-left:12px}
.formula{font-family:var(--f-math);font-size:1.08rem;background:var(--accent-soft);border-radius:6px;padding:10px 12px;overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-math)}

section.block{margin-top:36px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--f-math);font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;font-family:var(--f-body);font-weight:700;position:sticky;left:0;background:var(--surface)}
thead th{color:var(--muted);font-weight:400}
.note{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.note > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.note ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}

.panel{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
@media (max-width:780px){.panel{grid-template-columns:1fr}}
.paper-grid{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:10px}
#circle{width:100%;height:auto;display:block}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{font:inherit;font-family:var(--f-math);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;font-size:.92rem}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
label.lbl{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.readout .big{font-family:var(--f-math);font-size:1.6rem;line-height:1.3}
.readout .sub{font-family:var(--f-mono);color:var(--muted);font-size:.9rem;margin-top:6px}
.readout .how{margin-top:10px;font-size:.95rem}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:6px}

#graphBox{padding:0;overflow:hidden}
#graph{display:block;width:100%}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--f-math)}
.tog input{accent-color:var(--accent);margin:0}

.qwrap{max-width:720px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:16px}
.stat{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.stat b{color:var(--ink);font-weight:400}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qcat{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.qtext{font-size:1.25rem;line-height:1.6}
.qtext .m{font-size:1.15em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.opt{font:inherit;font-family:var(--f-math);font-size:1.1rem;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;min-height:2.6em}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{border-radius:8px;padding:12px 14px;font-size:1rem;line-height:1.7}
.expl.ok{background:var(--ok-soft)} .expl.no{background:var(--bad-soft)}
.expl b{display:block;margin-bottom:2px}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--paper);border:0;border-radius:8px;padding:11px 20px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.result{display:flex;flex-direction:column;gap:14px}
.score{font-family:var(--f-display);font-size:3rem;line-height:1}
.review{display:flex;flex-direction:column;gap:10px}
.review div{border-left:3px solid var(--bad);padding:4px 0 4px 12px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="htext">

    </div>

      <div class="sw" id="langSw" role="group" aria-label="Тіл / Язык">
        <button data-lang="ru">РУС</button><button data-lang="kz">ҚАЗ</button>

        <button data-th="dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span data-i="dark"></span></button>
      </div>

  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="t-theory" data-tab="theory" aria-selected="true" data-i="tTheory"></button>
    <button role="tab" id="t-circle" data-tab="circle" aria-selected="false" data-i="tCircle"></button>
    <button role="tab" id="t-graphs" data-tab="graphs" aria-selected="false" data-i="tGraphs"></button>

  <main>

      <h2 data-i="tblTitle"></h2>

      <div class="tbl-wrap"><table id="tblTC"></table></div>

          <label class="lbl" for="cSlider"><span data-i="numA"></span> <span id="cAval" class="m" style="text-transform:none;letter-spacing:0;font-size:1rem;color:var(--ink)"></span></label>
          <input type="range" id="cSlider" min="-1" max="1" step="0.01" value="0.5">

  <div id="p-graphs" class="pane" hidden>

<script>
/* ---------- язык ---------- */
let LANG='ru';
try{ const s=localStorage.getItem('arc-lang'); if(s==='kz'||s==='ru') LANG=s; }catch(e){}
const L=(ru,kz)=>LANG==='kz'?kz:ru;

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rnd = Math.random;
const pick = a => a[Math.floor(rnd()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const newSeed = () => Math.floor(Math.random()*2**31);
function withSeed(seed,fn){ const p=rnd; rnd=mulberry(seed); try{ return fn(); } finally{ rnd=p; } }
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a||1; };
const norm = ([p,q]) => { if(q<0){p=-p;q=-q;} const g=gcd(p,q); return [p/g,q/g]; };
const add = (a,b) => norm([a[0]*b[1]+b[0]*a[1], a[1]*b[1]]);
const frac = (n,d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const strip = h => h.replace(/<[^>]+>/g,'|');
function A(a){
  const [p,q] = norm(a); if(p===0) return '0';
  const s = p<0?'−':''; const P=Math.abs(p); const n=(P===1?'':P)+'π';
  return q===1 ? s+n : s+frac(n,q);
}
const num = x => (x<0?'−':'')+Math.abs(x).toFixed(3).replace(/\.?0+$/,'').replace('.',',');

/* ---------- данные ---------- */
const V = {
  '0':{h:'0',x:0}, '1/2':{h:frac('1','2'),x:.5}, 'r2/2':{h:frac('√2','2'),x:Math.SQRT2/2},
  'r3/2':{h:frac('√3','2'),x:Math.sqrt(3)/2}, '1':{h:'1',x:1}, 'r3/3':{h:frac('√3','3'),x:Math.sqrt(3)/3}, 'r3':{h:'√3',x:Math.sqrt(3)},
};
const negV = v => ({h:'−'+v.h, x:-v.x});
const R = { seg:`[${A([-1,2])}; ${A([1,2])}]`, segO:`(${A([-1,2])}; ${A([1,2])})`, zp:'[0; π]', zpO:'(0; π)' };
const H2 = A([1,2]);
const FN = {
  asin:{name:'arcsin',trig:'sin',odd:true, range:R.seg, word:'Арксинус', base:{'0':[0,1],'1/2':[1,6],'r2/2':[1,4],'r3/2':[1,3],'1':[1,2]}, f:Math.asin},
  acos:{name:'arccos',trig:'cos',odd:false,range:R.zp, word:'Арккосинус', base:{'0':[1,2],'1/2':[1,3],'r2/2':[1,4],'r3/2':[1,6],'1':[0,1]}, f:Math.acos},
  atg: {name:'arctg', trig:'tg', odd:true, range:R.segO,word:'Арктангенс', base:{'0':[0,1],'r3/3':[1,6],'1':[1,4],'r3':[1,3]}, f:Math.atan},
  actg:{name:'arcctg',trig:'ctg',odd:false,range:R.zpO, word:'Арккотангенс', base:{'0':[1,2],'r3/3':[1,3],'1':[1,4],'r3':[1,6]}, f:x=>Math.PI/2-Math.atan(x)},
};
const FKEYS=['asin','acos','atg','actg'];
function angleOf(fk,k,neg){ const b=FN[fk].base[k]; if(!neg) return b; return norm(FN[fk].odd?[-b[0],b[1]]:[b[1]-b[0],b[1]]); }

/* ---------- тексты интерфейса ---------- */
const UI = () => ({
  eyebrow: L('Алгебра · 10 класс','Алгебра және анализ бастамалары · 10-сынып · §6'),

  $('#tblTC').innerHTML=valueTable(['0','r3/3','1','r3'],['atg','actg']);
  const up=L('возрастает','бірсарынды өспелі'), dn=L('убывает','бірсарынды кемімелі'), od=L('нечётная','тақ'), nn=L('ни чётная, ни нечётная','жұп та, тақ та емес');
  $('#tblProps').innerHTML=`<thead><tr><th>y</th><th>D(y)</th><th>E(y)</th><th>${L('Монотонность','Бірсарындылығы')}</th><th>${L('Чётность','Жұп/тақтығы')}</th></tr></thead><tbody>
    <tr><td>arcsin x</td><td>[−1; 1]</td><td>${R.seg}</td><td>${up}</td><td>${od}</td></tr>

  $('#identities').innerHTML=[
    'sin(arcsin a) = a,&nbsp; |a| ≤ 1','cos(arccos a) = a,&nbsp; |a| ≤ 1',
    `arcsin a + arccos a = ${H2}`,`arctg a + arcctg a = ${H2}`,
    'cos(arcsin a) = √(1 − a²)','sin(arccos a) = √(1 − a²)',
    L(`arcsin(sin x) = x,&nbsp; только при x ∈ ${R.seg}`,`arcsin(sin x) = x,&nbsp; тек x ∈ ${R.seg} болғанда`)
  ].map(s=>`<li>${s}</li>`).join('');
  $('#eqs').innerHTML=['sin x = a ⇒ x = (−1)ⁿ arcsin a + πn','cos x = a ⇒ x = ±arccos a + 2πn','tg x = a ⇒ x = arctg a + πn','ctg x = a ⇒ x = arcctg a + πn','n ∈ ℤ'].map(s=>`<li>${s}</li>`).join('');
}


/* ---------- графики в теории ---------- */
let CARD_DEF=null;
const MM={asin:null,acos:null,atg:null,actg:null};
const MINI={asin:{x:[-2.2,2.2],y:[-2,2],u:100},acos:{x:[-2.2,2.2],y:[-.8,3.6],u:100},atg:{x:[-4.5,4.5],y:[-2.4,2.4],u:50},actg:{x:[-4.5,4.5],y:[-1,4],u:50}};
const EXP={asin:[Math.SQRT2/2,Math.PI/4,'√2/2','π/4'],acos:[-.5,2*Math.PI/3,'−1/2','2π/3'],atg:[Math.sqrt(3),Math.PI/3,'√3','π/3'],actg:[-1,3*Math.PI/4,'−1','3π/4']};
document.addEventListener('click',e=>{
  const b=e.target.closest('.prop'); if(!b) return;
  const k=b.dataset.fk, m=b.dataset.m; MM[k]=MM[k]===m?null:m;
  b.closest('.props').querySelectorAll('.prop').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===MM[k]));
  drawMini(k);
});
function drawMini(fk){
  const svg=$('#mini-'+fk); if(!svg) return; svg.innerHTML='';
  const M=MINI[fk], W=(M.x[1]-M.x[0])*M.u, H=(M.y[1]-M.y[0])*M.u, FS=21;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const X=x=>(x-M.x[0])*M.u, Y=y=>(M.y[1]-y)*M.u, col=`var(--c-${fk})`, f=FN[fk].f, mode=MM[fk];
  const P=Math.PI, H2_=P/2;
  const line=(x1,y1,x2,y2,a)=>el('line',Object.assign({x1:X(x1),y1:Y(y1),x2:X(x2),y2:Y(y2)},a),svg);
  const dash=(x1,y1,x2,y2,c)=>line(x1,y1,x2,y2,{stroke:c||col,'stroke-width':2,'stroke-dasharray':'7 6'});
  const dot=(x,y,open,c)=>el('circle',{cx:X(x),cy:Y(y),r:7,fill:open?'var(--surface)':(c||col),stroke:c||col,'stroke-width':2.5},svg);
  const t=(s,x,y,a)=>{const e=el('text',Object.assign({x,y,'font-size':FS,fill:'var(--muted)','font-family':'PT Serif, Georgia, serif','paint-order':'stroke',stroke:'var(--surface)','stroke-width':5,'stroke-linejoin':'round'},a||{}),svg);e.textContent=s;return e;};
  const path=(fn,a,b,attrs)=>{let d='',st=false;for(let i=0;i<=240;i++){const x=a+(b-a)*i/240,y=fn(x);if(!isFinite(y)||y>M.y[1]+1||y<M.y[0]-1){st=false;continue;}d+=(st?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);st=true;}return el('path',Object.assign({d,fill:'none'},attrs),svg);};
  // сетка
  for(let i=Math.ceil(M.x[0]);i<=M.x[1];i++) line(i,M.y[0],i,M.y[1],{stroke:'var(--line)','stroke-width':1});
  for(let i=Math.ceil(M.y[0]);i<=M.y[1];i++) line(M.x[0],i,M.x[1],i,{stroke:'var(--line)','stroke-width':1});
  // оси
  const defs=el('defs',{},svg), mk=el('marker',{id:'ma-'+fk,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:8,markerHeight:8,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0 0L10 5L0 10z',fill:'var(--muted)'},mk);
  line(M.x[0],0,M.x[1]-.02,0,{stroke:'var(--muted)','stroke-width':2,'marker-end':`url(#ma-${fk})`});
  line(0,M.y[0],0,M.y[1]-.02,{stroke:'var(--muted)','stroke-width':2,'marker-end':`url(#ma-${fk})`});
  t('x',W-18,Y(0)-10,{'font-style':'italic'}); t('y',X(0)+10,22,{'font-style':'italic'}); t('O',X(0)-22,Y(0)+24);
  const PX0={asin:.8,acos:.6,atg:1.6,actg:1.5}[fk], EXX=EXP[fk][0];
  for(let i=Math.ceil(M.x[0]);i<=M.x[1]-.3;i++){ if(!i) continue; if(mode==='par'&&Math.min(Math.abs(i-PX0),Math.abs(i+PX0))*M.u<34) continue; if(mode==='ex'&&Math.abs(i-EXX)*M.u<34) continue; t((i<0?'−':'')+Math.abs(i),X(i),Y(0)+26,{'text-anchor':'middle'}); }
  [[-H2_,'−π/2'],[H2_,'π/2'],[P,'π']].forEach(([y,l])=>{ if(y<M.y[0]||y>M.y[1]) return; line(M.x[0],y,M.x[1],y,{stroke:'var(--muted)','stroke-width':1,'stroke-dasharray':'3 5'}); t(l,X(0)+8,Y(y)-7); });
  // асимптоты
  if(fk==='atg'){ dash(M.x[0],H2_,M.x[1],H2_); dash(M.x[0],-H2_,M.x[1],-H2_); }
  if(fk==='actg'){ dash(M.x[0],P,M.x[1],P); }
  const D=(fk==='asin'||fk==='acos')?[-1,1]:[M.x[0],M.x[1]];
  const E={asin:[-H2_,H2_],acos:[0,P],atg:[-H2_,H2_],actg:[0,P]}[fk], closed=fk==='asin'||fk==='acos';
  // режимы — подложки
  if(mode==='dom'){
    el('rect',{x:X(D[0]),y:Y(0)-8,width:X(D[1])-X(D[0]),height:16,rx:8,fill:col,'fill-opacity':.35},svg);
    if(closed){ dash(-1,0,-1,f(-1)); dash(1,0,1,f(1)); dot(-1,0); dot(1,0); }
  }
  if(mode==='rng'){
    el('rect',{x:X(0)-8,y:Y(E[1]),width:16,height:Y(E[0])-Y(E[1]),rx:8,fill:col,'fill-opacity':.35},svg);
    el('rect',{x:0,y:Y(E[1]),width:W,height:Y(E[0])-Y(E[1]),fill:col,'fill-opacity':.07},svg);
    if(fk==='asin'){ dash(0,H2_,1,H2_); dash(0,-H2_,-1,-H2_); }
    if(fk==='acos'){ dash(0,P,-1,P); }
    dot(0,E[0],!closed); dot(0,E[1],!closed);
  }
  if(mode==='inv'){
    line(M.x[0],M.x[0],M.x[1],M.x[1],{stroke:'var(--muted)','stroke-width':2,'stroke-dasharray':'10 7'});
    const O={asin:[Math.sin,-H2_,H2_],acos:[Math.cos,0,P],atg:[Math.tan,-H2_+.01,H2_-.01],actg:[x=>1/Math.tan(x),.01,P-.01]}[fk];
    path(O[0],O[1],O[2],{stroke:col,'stroke-width':3,'stroke-dasharray':'4 6','stroke-opacity':.75});
    const nm={asin:'y = sin x',acos:'y = cos x',atg:'y = tg x',actg:'y = ctg x'}[fk];
    const lp={asin:[1.2,.75],acos:[1.75,-.5],atg:[.45,-.8],actg:[2.6,-.6]}[fk];
    t(nm,X(lp[0]),Y(lp[1]),{fill:col,'font-style':'italic'});
    const yl={asin:[1.55,1.85],acos:[2.35,2.1],atg:[2.05,2.1],actg:[3.2,3.3]}[fk];
    t('y = x',X(yl[0]),Y(yl[1]),{'font-style':'italic','text-anchor':fk==='atg'?'start':'end'});
  }
  // кривая
  path(f,D[0]+(closed?0:.0),D[1],{stroke:col,'stroke-width':mode==='mono'?7:4.5,'stroke-linecap':'round'});
  if(closed){ dot(-1,f(-1)); dot(1,f(1)); }
  const nl={asin:[M.x[0]+.12,M.y[1]-.3,'start'],acos:[M.x[1]-.12,M.y[1]-.35,'end'],atg:[M.x[0]+.15,M.y[1]-.3,'start'],actg:[M.x[1]-.15,M.y[1]-.4,'end']}[fk];
  t('y = '+FN[fk].name+' x',X(nl[0]),Y(nl[1]),{fill:col,'font-style':'italic','font-size':FS+3,'text-anchor':nl[2],'font-weight':'bold'});
  // режимы — поверх
  if(mode==='par'){
    const x0=PX0;
    const p1=[x0,f(x0)], p2=[-x0,f(-x0)];
    dash(p1[0],0,p1[0],p1[1]); dash(p2[0],0,p2[0],p2[1]);
    if(FN[fk].odd){ dash(p1[0],p1[1],p2[0],p2[1],'var(--ink)'); dot(0,0,false,'var(--ink)'); }
    else { dash(M.x[0],H2_,M.x[1],H2_,'var(--muted)'); dash(p1[0],p1[1],p2[0],p2[1],'var(--ink)'); dot(0,H2_,false,'var(--ink)'); }
    dot(p1[0],p1[1]); dot(p2[0],p2[1]);
    t('x',X(x0),Y(0)+(FN[fk].odd?-12:26),{'text-anchor':'middle','font-style':'italic',fill:'var(--ink)','font-weight':'bold'});
    t('−x',X(-x0),Y(0)+(FN[fk].odd?-12:26),{'text-anchor':'middle','font-style':'italic',fill:'var(--ink)','font-weight':'bold'});
  }
  if(mode==='mono'){
    const xs=closed?[-.55,.55]:[-2.4,0,2.4];
    xs.forEach(x=>{ const x1=X(x),y1=Y(f(x)),x2=X(x+.01),y2=Y(f(x+.01)); const a=Math.atan2(y2-y1,x2-x1);
      const L_=22,Wd=12, pts=[[x1+Math.cos(a)*L_,y1+Math.sin(a)*L_],[x1+Math.cos(a+Math.PI/2)*Wd,y1+Math.sin(a+Math.PI/2)*Wd],[x1-Math.cos(a+Math.PI/2)*Wd,y1-Math.sin(a+Math.PI/2)*Wd]];
      el('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:'var(--ink)'},svg); });
  }

const POOL=[[0,1],[1,6],[1,4],[1,3],[1,2],[2,3],[3,4],[5,6],[1,1],[-1,6],[-1,4],[-1,3],[-1,2]];
const CATN = () => ({val:L('Значения','Мәндер'),sum:L('Выражения','Өрнектер'),prop:L('Свойства','Қасиеттер'),eq:L('Уравнения','Теңдеулер')});

  const opts=shuffle([correct,...w]); return {cat:CATN()[cat],q,opts,ans:opts.indexOf(correct),ex};
}

/* ---------- отрисовка задания ---------- */
const LET='АБВГ';
function renderQ(box,q,chosen,{onAnswer,nextLabel,onNext}){
  box.innerHTML=`<div class="qcard">
    <div class="qcat">${q.cat}</div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${LET[i]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="fb"></div></div>`;
  const btns=[...box.querySelectorAll('.opt')];
  const showFb=(i,focus)=>{
    const ok=i===q.ans;
    btns.forEach(x=>{x.disabled=true;}); btns[q.ans].classList.add('right'); if(!ok) btns[i].classList.add('wrong');
    const fb=box.querySelector('.fb');
    fb.innerHTML=`<div class="expl ${ok?'ok':'no'}"><b>${ok?L('Верно!','Дұрыс!'):L('Неверно. Правильный ответ: ','Қате. Дұрыс жауап: ')+(ok?'':LET[q.ans])}</b>${q.ex}</div>`;
    const nb=document.createElement('button'); nb.className='btn'; nb.textContent=nextLabel(); nb.style.marginTop='14px';
    nb.addEventListener('click',onNext); fb.appendChild(nb); if(focus) nb.focus({preventScroll:true});
  };
  if(chosen!=null) showFb(chosen,false);
  btns.forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i; showFb(i,true); onAnswer(i===q.ans,i);}));
}

  $('#testBox').innerHTML=`<div class="qcard">
    <h2 style="margin:0">${L('Итоговый тест','Қорытынды тест')}</h2>
    <p>${L('10 заданий: значения аркфункций, выражения, свойства и простейшие тригонометрические уравнения. После каждого ответа показывается разбор, в конце — итог и список ошибок.','10 тапсырма: аркфункциялардың мәндері, өрнектер, қасиеттер және қарапайым тригонометриялық теңдеулер. Әр жауаптан кейін талдау көрсетіледі, соңында — қорытынды және қателер тізімі.')}</p>
    ${best!==null?`<p class="stat">${L('Ваш лучший результат','Ең жақсы нәтижеңіз')}: <b>${best} / 10</b></p>`:''}
    <button class="btn" id="tStart">${L('Начать тест','Тестті бастау')}</button></div>`;
  $('#tStart').addEventListener('click',startTest);
}
function startTest(){
  TT.recs=shuffle(['val','val','val','val','sum','sum','prop','prop','eq','eq']).map(c=>({cat:c,seed:newSeed()}));
  TT.i=0; TT.ok=0; TT.chosen=[]; TT.phase='q'; testStep();
}
function testStep(){
  const q=build(TT.recs[TT.i]), box=$('#testBox'), ch=TT.chosen[TT.i];
  box.innerHTML=`<div class="bar"><span class="stat">${L('Задание','Тапсырма')} <b>${TT.i+1}</b> / 10</span><span class="stat">${L('Верно','Дұрыс')}: <b>${TT.ok}</b></span></div>
    <div class="progress" style="margin-bottom:16px"><i style="width:${(TT.i+(ch!=null?1:0))*10}%"></i></div><div id="tQ"></div>`;
  renderQ($('#tQ'),q,ch,{nextLabel:()=>TT.i<9?L('Дальше','Әрі қарай'):L('Показать результат','Нәтижені көрсету'),
    onNext:()=>{TT.i++; if(TT.i<10) testStep(); else {TT.phase='end'; testEnd();}},
    onAnswer:(ok,i)=>{ TT.chosen[TT.i]=i; if(ok) TT.ok++; box.querySelector('.progress i').style.width=(TT.i+1)*10+'%'; box.querySelector('.stat:last-child b').textContent=TT.ok; }});
}
let savedScore=false;
function testEnd(){
  const s=TT.ok;
  const msg = s>=9?L('Отлично! Тема усвоена.','Өте жақсы! Тақырып меңгерілді.')
    : s>=7?L('Хорошо. Повторите задания, где были ошибки.','Жақсы. Қате жіберген тапсырмаларды қайталаңыз.')
    : s>=5?L('Неплохо, но стоит ещё потренироваться во вкладке «Тренажёр».','Жаман емес, бірақ «Жаттықтырғыш» бөлімінде тағы жаттығу керек.')
    : L('Вернитесь к теории и окружности, затем потренируйтесь ещё.','Теория мен шеңберге қайта оралып, сосын тағы жаттығыңыз.');
  try{ const prev=localStorage.getItem('arc-test'); if(prev===null||s>+prev) localStorage.setItem('arc-test',s);}catch(e){}
  const wrong=TT.recs.map((r,i)=>({q:build(r),c:TT.chosen[i]})).filter(x=>x.c!==x.q.ans);
  $('#testBox').innerHTML=`<div class="qcard result">
    <div class="qcat">${L('Результат','Нәтиже')}</div>
    <div class="score">${s} <span style="font-size:1.4rem;color:var(--muted)">/ 10</span></div>
    <p>${msg}</p>
    ${wrong.length?`<h3>${L('Разбор ошибок','Қателерді талдау')}</h3><div class="review">${wrong.map(({q})=>`<div>${q.q}<br>${L('Ответ','Жауабы')}: ${q.opts[q.ans]}<br><span style="color:var(--muted)">${q.ex}</span></div>`).join('')}</div>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="tAgain">${L('Пройти ещё раз','Қайта тапсыру')}</button><button class="btn ghost" id="tTrain">${L('Перейти в тренажёр','Жаттықтырғышқа өту')}</button></div></div>`;
  $('#tAgain').addEventListener('click',startTest);
  $('#tTrain').addEventListener('click',()=>showTab('train'));
}

/* ---------- переключатели ---------- */
function renderAll(){ applyUI(); renderTheory(); drawCircle(); renderTrCat(); stats(); drawTrain(); drawTest(); }
$('#langSw').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.dataset.lang===LANG) return;
  LANG=b.dataset.lang; try{localStorage.setItem('arc-lang',LANG);}catch(e){} renderAll();
});
const mq=matchMedia('(prefers-color-scheme: dark)');
function effTheme(){ return document.documentElement.dataset.theme || (mq.matches?'dark':'light'); }
function syncTheme(){ const t=effTheme(); [...$('#themeSw').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===t)); if(!$('#p-graphs').hidden) drawGraph(); }
$('#themeSw').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.documentElement.dataset.theme=b.dataset.th; try{localStorage.setItem('arc-theme',b.dataset.th);}catch(e){} syncTheme();
});
try{ const t=localStorage.getItem('arc-theme'); if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; }catch(e){}
mq.addEventListener('change',syncTheme);
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function setSize(px){ document.documentElement.style.fontSize=px+'px'; [...$('#sizeSw').children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.sz===px)); if(!$('#p-graphs').hidden) drawGraph(); }
$('#sizeSw').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const px=+b.dataset.sz; setSize(px); try{localStorage.setItem('arc-size',px);}catch(e){} });
(function(){ let px=22; try{ const v=+localStorage.getItem('arc-size'); if([16,22,28].includes(v)) px=v; }catch(e){} setSize(px); })();

/* ---------- старт ---------- */
T.rec={cat:'all',seed:newSeed()};
buildChips();
renderAll();
syncTheme();
(function(){ const h=location.hash.slice(1); let t=TABS.includes(h)?h:null;
  if(!t){ try{ const s=localStorage.getItem('arc-tab'); if(TABS.includes(s)) t=s; }catch(e){} }
  showTab(t||'theory'); })();
</script>
